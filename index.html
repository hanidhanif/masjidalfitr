<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A1F44" />
  <meta name="description" content="Digital Signage Masjid AL-FITR - Bandaneira" />
  <title>Masjid AL-FITR | Digital Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.3/lib/adhan.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <!-- Header -->
    <header class="header">
      <div class="mosque-info">
        <div class="mosque-badge">بِسْمِ ٱللَّهِ</div>
        <div class="mosque-name">MASJID AL-FITR</div>
        <div class="mosque-location" id="locationLabel">Bandaneira, Maluku</div>
      </div>
      <div class="datetime">
        <div class="time" id="currentTime">--:--:--</div>
        <div class="dates">
          <span id="gregorianDate">—</span>
          <span class="separator">•</span>
          <span id="hijriDate">—</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Next Prayer Card -->
      <section class="next-prayer-card" id="nextPrayerCard">
        <div class="next-label">Waktu Sholat Berikutnya</div>
        <div class="next-name" id="nextPrayerName">—</div>
        <div class="countdown" id="countdown">--:--:--</div>
        <div class="next-time" id="nextPrayerTime">—</div>
      </section>

      <!-- Prayer Times Grid -->
      <section class="prayer-grid" id="prayerGrid">
        <!-- Filled by JS -->
      </section>

      <!-- Info / Quote Section -->
      <section class="info-section">
        <div class="quote-card" id="quoteCard">
          <div class="quote-text" id="quoteText">Loading...</div>
          <div class="quote-source" id="quoteSource"></div>
        </div>
      </section>
    </main>

    <!-- Running Text -->
    <div class="running-text-container">
      <div class="running-text" id="runningText">
        Selamat datang di Masjid AL-FITR Bandaneira • Mari jaga kebersihan masjid • Shalat berjamaah lebih utama 27 derajat • 
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Masjid AL-FITR • Bandaneira</span>
      <span id="methodLabel">Metode: Muslim World League</span>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
